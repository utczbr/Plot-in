name: Full Test Suite Execution

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'installer/**'
      - 'shared/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'installer/**'
      - 'shared/**'
      - 'pyproject.toml'

jobs:
  test-suite:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System EGL & Qt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install Package & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]

      - name: Run Full Pytest Suite
        run: pytest tests/ -v
