[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plotin"
version = "1.0.0"
description = "Automated chart data extraction from scientific publications"
readme = "src/README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Minimal core dependencies — enough to run the extraction pipeline.
# GUI, OCR engines, and dev tools are in optional extras below.
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python>=4.8,<5",
    "onnxruntime>=1.21,<2",
    "scikit-learn>=1.3,<2",
    "scipy>=1.11,<2",
    "Pillow>=10,<12",
    "PyMuPDF>=1.23,<2",
    "PyYAML>=6,<7",
    "doclayout-yolo>=0.0.3",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
# GUI application
gui = [
    "PyQt6>=6.6,<7",
    "PyQt6-Qt6>=6.6,<7",
    "PyQt6-sip>=13.6",
]
# EasyOCR engine (pulls torch as a transitive dependency)
ocr-easyocr = [
    "easyocr>=1.7",
    "torch>=2.1,<3",
    "torchvision>=0.16",
]
# Development & testing
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "hypothesis>=6.92",
    "black>=23.12",
    "isort>=5.13",
    "flake8>=6.1",
    "mypy>=1.7",
    "pre-commit>=3.6",
]
# All extras combined
all = ["plotin[gui,ocr-easyocr,dev]"]

[project.scripts]
plotin = "analysis:main"
plotin-gui = "main_modern:main"
plotin-fetch-models = "scripts.fetch_models:main"

[project.urls]
Homepage = "https://github.com/utcz/Plot-in"
Repository = "https://github.com/utcz/Plot-in"

# ---------------------------------------------------------------------------
# setuptools configuration
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["core*", "calibration*", "extractors*", "handlers*", "ocr*",
           "pipelines*", "services*", "strategies*", "utils*", "validation*",
           "visual*", "ui*", "evaluation*", "scripts*", "shared*"]
exclude = ["tests*", "src/tests*", "demos*", "train*", "docs*",
           "images*", "models*", "config*"]

[tool.setuptools.package-dir]
"" = "src"
"shared" = "shared"

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.json"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 120
target-version = ["py310"]

# ---------------------------------------------------------------------------
# isort
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src", "tests"]
